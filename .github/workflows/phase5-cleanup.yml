name: phase5-cleanup

# push (এই ফাইল/স্ক্রিপ্ট বদলালে) অটো dry-run চলে; delete সবসময় হাতে।
# হাতে-চালানো। আগে mode=dry-run (শুধু গণনা), ফল দেখে তারপর mode=delete।
# delete-এর জন্য confirm ঘরে DELETE লিখতে হয়। Secret: FIREBASE_SERVICE_ACCOUNT (deploy-rules-এর মতো)।
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase5-cleanup.yml'
      - 'tools/phase5_cleanup.mjs'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run বা delete'
        required: true
        default: 'dry-run'
      confirm:
        description: 'delete হলে DELETE লিখুন'
        required: false

jobs:
  cleanup:
    if: ${{ github.event_name == 'push' || inputs.mode == 'dry-run' || (inputs.mode == 'delete' && inputs.confirm == 'DELETE') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Service account
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Install firebase-admin (project dependency নয়)
        run: |
          mkdir -p "$RUNNER_TEMP/admin" && cd "$RUNNER_TEMP/admin"
          npm init -y >/dev/null && npm install firebase-admin@13.0.2 --no-audit --no-fund
          cp "$GITHUB_WORKSPACE/tools/phase5_cleanup.mjs" .
      - name: Run
        working-directory: ${{ runner.temp }}/admin
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          MODE: ${{ inputs.mode || 'dry-run' }}
        run: node phase5_cleanup.mjs "$MODE"
