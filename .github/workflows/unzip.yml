name: unzip-upload

# রেপোর ROOT-এ *.zip আপলোড (web "Upload files" → commit to vite-migration) করলে এই workflow
# zip খুলে রেপোর উপর বসায়, zip মুছে commit করে এবং CI চালু করে।
# Cloudflare Pages Git-integration নিজেই এই commit দেখে deploy করে — আলাদা deploy workflow লাগে না।
# Flat zip বা একটি wrapper-folder-যুক্ত zip — দুটোই চলে। zip-এর ভেতরের .github/ ইচ্ছাকৃতভাবে উপেক্ষিত
# (built-in token workflow-ফাইল বদলাতে পারে না — ওগুলো হাতে আপলোড করুন)।
# নোট: zip শুধু ফাইল যোগ/overwrite করে; মুছতে হলে GitHub-এ হাতে মুছুন।
on:
  push:
    branches: [vite-migration]
    paths: ['*.zip']

permissions:
  contents: write
  actions: write

concurrency:
  group: unzip-upload
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and commit
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "no zip at repo root"; exit 0; fi
          for z in "${zips[@]}"; do
            tmp=$(mktemp -d)
            unzip -q "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            entries=("$tmp"/*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then src="${entries[0]}"; else src="$tmp"; fi
            rm -rf "$src/.github" "$src/.git"
            cp -a "$src"/. .
            rm -rf "$tmp"
            git rm -q "$z"
          done
          git config user.name "unzip-bot"
          git config user.email "unzip-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: apply uploaded zip (${zips[*]})"
            git push origin HEAD:vite-migration
          fi

      # built-in token দিয়ে push করলে অন্য workflow নিজে চালু হয় না — তাই CI স্পষ্টভাবে চালু।
      - name: Trigger CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref vite-migration
