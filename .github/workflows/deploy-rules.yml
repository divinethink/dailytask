name: deploy-rules

# Firestore Rules হাতে-চালানো deploy (Actions ট্যাব → deploy-rules → Run workflow)।
# ভুলে ট্যাপ ঠেকাতে confirm ঘরে DEPLOY লিখতে হয়।
# Secret লাগবে: FIREBASE_SERVICE_ACCOUNT (service-account JSON, পুরোটা)। project id ওই JSON থেকেই নেওয়া হয়।
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'নিশ্চিত করতে DEPLOY লিখুন'
        required: true

jobs:
  rules:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Service account
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy firestore.rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -euo pipefail
          PID=$(node -p "require(process.env.GOOGLE_APPLICATION_CREDENTIALS).project_id")
          echo "Deploying rules to project: $PID"
          npx --yes firebase-tools@15.32.1 deploy --only firestore:rules --project "$PID"
