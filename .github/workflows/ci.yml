name: ci

# Build-check: কোড ভাঙলে সাথে সাথে ধরা পড়ে। (Pages deploy এর উপর নির্ভরশীল না — এটা শুধু সতর্কসংকেত।)
on:
  push:
    branches: [vite-migration]
    paths-ignore: ['*.zip']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
