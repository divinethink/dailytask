name: ci

# Build-check: কোড ভাঙলে সাথে সাথে ধরা পড়ে। (Pages deploy এর উপর নির্ভরশীল না — এটা শুধু সতর্কসংকেত।)
on:
  push:
    branches: [main]
    paths-ignore: ['*.zip']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.test.mjs

  # Firestore Rules: cross-family isolation (emulator)। আলাদা job — ব্যর্থ হলে build/test ফল ঢাকা পড়ে না।
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # package-lock বদলাতে না হয় — তাই শুধু CI-তে, lock ছাড়া ইনস্টল।
      - run: npm install --no-save @firebase/rules-unit-testing@3.0.4
      - run: npx --yes firebase-tools@15.32.1 emulators:exec --only firestore --project demo-dailytask "node --test rules-tests/*.test.mjs"
