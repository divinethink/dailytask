<!-- A8: Runtime Feature-Flag(instant rollback, redeploy ছাড়া) — এই origin(V2/Vite)-এর
     সবচেয়ে প্রথম script, যাতে redirect সিদ্ধান্ত বাকি সব asset/JS লোড হওয়ার আগেই নেওয়া হয়।
     ?legacy=1 → পুরনো(V1/main) production-এ পাঠায় + localStorage flag persist করে(পরবর্তী visit-এও কাজ করবে)।
     ?legacy=0 → flag clear করে V2-তেই থাকে, URL থেকে param সরিয়ে দেয়(reload ছাড়া)।
     কোনো param না থাকলে শুধু persisted flag চেক করে। কোনো error হলে fail-safe: চুপচাপ normal V2 লোড হয়। -->
<script>
  (function () {
    try {
      var LEGACY_URL = "https://dailytask-family.pages.dev/";
      var FLAG_KEY = "dt_legacy_flag";
      var params = new URLSearchParams(window.location.search);
      var qp = params.get("legacy");
      if (qp === "1") {
        localStorage.setItem(FLAG_KEY, "1");
        window.location.replace(LEGACY_URL);
        return;
      }
      if (qp === "0") {
        localStorage.removeItem(FLAG_KEY);
        params.delete("legacy");
        var newSearch = params.toString();
        var newUrl = window.location.pathname + (newSearch ? "?" + newSearch : "") + window.location.hash;
        window.history.replaceState({}, "", newUrl);
      } else if (localStorage.getItem(FLAG_KEY) === "1") {
        window.location.replace(LEGACY_URL);
        return;
      }
    } catch (e) {
      // localStorage/URL blocked/unavailable হলেও silent fail — V2 স্বাভাবিকভাবে লোড হবে
    }
  })();
</script>

<!-- লোড-স্পিড ফিক্স(১৯ সেপ্টেম্বর ২০২৬, owner-রিপোর্টেড "অ্যাপ ওপেন হতে সময় নেয়"):

<!-- লোড-স্পিড ফিক্স(২১ সেপ্টেম্বর ২০২৬, owner-রিপোর্টেড "অ্যাপ ওপেন হতে সময় নেয়"):
     এই ফন্ট-লিংক আগে src/legacy/appHelpers.js-এর useFonts()(useEffect) দিয়ে
     JS-execution-এর পরে dynamically inject হতো — অর্থাৎ React/JS bundle পুরো
     download+parse+execute হওয়া পর্যন্ত ফন্ট-ডাউনলোড শুরুই হতো না(দুর্বল-প্রসেসর
     ডিভাইসে এই serial-chain-ই সবচেয়ে বড় বিলম্বের একটা কারণ)। এখন static HTML-এ
     সরাসরি বসানো হলো, যাতে browser-এর preload-scanner শুরুতেই(কোনো JS ছাড়াই)
     ফন্ট-ফাইল fetch শুরু করতে পারে। href হুবহু অপরিবর্তিত(ফন্ট/weight/display
     কিছুই বদলায়নি)। useFonts() হুক নিজে সরানো হয়নি(app.js/appHelpers.js touch
     হয়নি) — id="dt-fonts" এখানেও দেওয়া হয়েছে যাতে হুকের বিদ্যমান
     `document.getElementById(id)` duplicate-guard এটাকে already-present ধরে
     no-op করে, দ্বিতীয়বার fetch না হয়। -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link id="dt-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />

<script>
  // Suppresses a known-safe, cosmetic console warning:
  // Firestore's enableIndexedDbPersistence() deprecation notice
  // (app.js intentionally keeps using this proven API; only the
  // console noise is hidden here, behavior is unchanged).
  (function () {
    const _origWarn = console.warn;
    const SUPPRESSED_SUBSTRINGS = [
      "enableIndexedDbPersistence",
      "Failed to obtain exclusive access to the persistence layer",
    ];
    console.warn = function (...args) {
      const combined = args
        .map((a) => (typeof a === "string" ? a : (a && a.message) || ""))
        .join(" ");
      if (SUPPRESSED_SUBSTRINGS.some((s) => combined.includes(s))) return;
      _origWarn.apply(console, args);
    };
  })();
</script>

<!-- Google Identity Services (GIS) — শুধুমাত্র Google Drive ব্যাকআপ ফিচারের
     জন্য ব্যবহৃত হয় (drive.file স্কোপ, token client)। Firebase Auth-এর
     Google Sign-In থেকে আলাদা এবং স্বাধীন। A3 scope-এর বাইরে (npm equivalent নেই), অপরিবর্তিত। -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
