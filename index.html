<meta charset="UTF-8" />

<title>Daily Task — আমল ও পারিবারিক ট্র্যাকার</title>
<meta name="theme-color" content="#0E4B43" />
<link rel="manifest" href="manifest.json" />

<!-- Preconnect: origin-এর DNS/TLS আগে থেকে parallel শুরু করার জন্য (execution order/dependency অপরিবর্তিত) -->
<!-- A3 note: unpkg.com/jsdelivr.net/gstatic.com preconnect সরানো হয়েছে — React/Chart.js/Firebase এখন npm-bundled, ওই CDN থেকে আর কিছু লোড হয় না। cdn.tailwindcss.com ও accounts.google.com (GIS, Drive backup) অপরিবর্তিত — এই দুইটা A3 scope-এর বাইরে। -->
<link rel="preconnect" href="https://cdn.tailwindcss.com" />
<link rel="preconnect" href="https://accounts.google.com" />

<!-- Tailwind CSS -->
<script>
  // Suppresses two known-safe, cosmetic console warnings:
  // 1) Tailwind's "should not be used in production" CDN notice.
  // 2) Firestore's enableIndexedDbPersistence() deprecation notice
  //    (app.js intentionally keeps using this proven API; only the
  //    console noise is hidden here, behavior is unchanged).
  (function () {
    const _origWarn = console.warn;
    const SUPPRESSED_SUBSTRINGS = [
      "cdn.tailwindcss.com",
      "enableIndexedDbPersistence",
      "Failed to obtain exclusive access to the persistence layer",
    ];
    console.warn = function (...args) {
      const combined = args
        .map((a) => (typeof a === "string" ? a : (a && a.message) || ""))
        .join(" ");
      if (SUPPRESSED_SUBSTRINGS.some((s) => combined.includes(s))) return;
      _origWarn.apply(console, args);
    };
  })();
</script>
<script src="https://cdn.tailwindcss.com" defer></script>

<!-- Google Identity Services (GIS) — শুধুমাত্র Google Drive ব্যাকআপ ফিচারের
     জন্য ব্যবহৃত হয় (drive.file স্কোপ, token client)। Firebase Auth-এর
     Google Sign-In থেকে আলাদা এবং স্বাধীন। A3 scope-এর বাইরে (npm equivalent নেই), অপরিবর্তিত। -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

  .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }

  @media print {

    .print-page { width: 183mm !important; max-width: 183mm !important; box-sizing: border-box !important; }
    .print-daily-table { width: 100% !important; table-layout: fixed !important; }
    .print-daily-table th, .print-daily-table td { box-sizing: border-box !important; }
  }
</style>
